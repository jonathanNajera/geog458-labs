
<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8' />
    <title>my First Map</title>
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
   </style>
</head>
<body>
   <div id='map'></div>
   <script>
      mapboxgl.accessToken = 'pk.eyJ1Ijoiam9uYXRoYW4yNTMiLCJhIjoiY212Nnc2bndpMDJieTM0cWEyZWJlYm1nYSJ9.IsBi7uelpGVQ-psYYpeSGg';
      const mymap = new mapboxgl.Map({
    container: 'map',
    //style: 'mapbox://styles/mapbox/dark-v11',
    //projection: 'globe',
    center: [-122.2676, 47.5520], // Seward Park, Seattle - my favorite place to go for a run
    zoom: 16 // starting zoom
});

mymap.on('style.load', () => {
    mymap.setConfigProperty('basemap', 'lightPreset', 'dusk'); // Set the light preset to dusk
    mymap.setConfigProperty('basemap', 'showPointOfInterestLabels', false); // Hide point of interest labels
    mymap.setConfigProperty('basemap', 'theme', 'monochrome'); // Set the theme to monochrome
    mymap.setConfigProperty('basemap', 'showTransitLabels', false); //Hides transit labels, could be useful to have them though
  });
mymap.addControl(new mapboxgl.FullscreenControl()); // adds fullscreen button
mymap.addControl(new mapboxgl.NavigationControl()); // adds zoom and rotation controls
</script>
</body>
</html>
